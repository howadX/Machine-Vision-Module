[package]
name = "mvm-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MVM pipeline — camera capture (Python bridge + native v4l2), module orchestration"

[features]
default = []
kinect-v1 = ["dep:libloading", "dep:sha2"]

[dependencies]
mvm-core = { path = "../mvm-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 7.2 native camera (pure-Rust v4l2 mmap, validated by spikes/cam-spike).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
v4l = "0.14"
libloading = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
