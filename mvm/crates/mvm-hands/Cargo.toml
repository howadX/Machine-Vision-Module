[package]
name = "mvm-hands"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MVM hand landmarks — MediaPipe handpose (OpenCV Zoo) ONNX, body-primary wrist ROIs"

[features]
default = []
embed-model = []

[dependencies]
mvm-core = { path = "../mvm-core" }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
