[package]
name = "mvm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MVM CLI — binary entry point and state file writer"

# The user types `mvm run`, not `mvm-cli run` (phase 14.0.5).
[[bin]]
name = "mvm"
path = "src/main.rs"

[features]
default = []
embed-models = ["mvm-detect/embed-model", "mvm-posture/embed-model"]

[dependencies]
mvm-core = { path = "../mvm-core" }
mvm-detect = { path = "../mvm-detect" }
mvm-emotion = { path = "../mvm-emotion" }
mvm-identity = { path = "../mvm-identity" }
mvm-posture = { path = "../mvm-posture" }
mvm-scene = { path = "../mvm-scene" }
mvm-depth = { path = "../mvm-depth" }
mvm-hands = { path = "../mvm-hands" }
mvm-pipeline = { path = "../mvm-pipeline" }
mvm-fusion = { path = "../mvm-fusion" }
mvm-mesh = { path = "../mvm-mesh" }
mvm-dataset = { path = "../mvm-dataset" }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Product-layer config (phase 14.0.2) — lives ONLY in mvm-cli, never in the vision core.
toml = "0.8"
# `mvm setup` model fetch (phase 14.1) — product layer only. ureq is already in
# the build tree (ort-sys build-dep); sha2 verifies fetched model integrity.
ureq = "3"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
